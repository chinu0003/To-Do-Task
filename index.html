<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>To-Do List</h1>
            <div class="addTask">
                <input type="text" placeholder="Add your task here">
                <button>Add</button>
            </div>
            <ul class="pendingTasks">
                <li><input type="checkbox"><p>Task 1</p><!--<button class="editButton">Edit</button>--><button class="deleteButton">Delete</button></li>
                <li><input type="checkbox"><p>Task 2</p><!--<button class="editButton">Edit</button>--><button class="deleteButton">Delete</button></li>
            </ul>
            <ul class="doneTasks"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
